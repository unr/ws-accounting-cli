[project]
name = "ws-accounting-cli"
version = "0.1.0"
description = "Personal finance TUI built with Textual + hledger"
readme = "README.md"
authors = [
    { name = "Paul Morrison", email = "paul.unr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0.0",
    "textual-plotext>=0.2.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "textual-dev>=1.0", "syrupy>=4.0", "ruff>=0.8"]

[project.scripts]
ws-accounting = "ws_accounting.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws_accounting"]

[tool.ruff]
target-version = "py312"
line-length = 100
